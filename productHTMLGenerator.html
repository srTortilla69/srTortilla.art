<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Generate Product HTML</title>
</head>
<body>
<script>
// This script generates standalone HTML for a product list and downloads it as a file

const products = [
 // Static Product Filtering by Category ###MATCH THIS ELEMENTS WITH THE HTML CODE USING THE GENERATEPRODUCTHTML.html###
    { id: 1, category: 'Art', name: 'Jay', price: 39.99, image: 'Halloween2025/Json/Json.jpg', description: 'Crazy friday nights'  },
    { id: 2, category: 'Art', name: 'Dancing Clown', price: 39.99, image: 'Halloween2025/DancingClown/DjJodaCloseUp.jpg', description: '#floating' },
    { id: 3, category: 'Art', name: 'Chuck', price: 39.99, image: 'Halloween2025/Chuck/Chuck.jpg', description: 'Cursed doll' },
];

function generateStaticHTML() {
  let html = ``;

  products.forEach(product => {
    html += `  <div class="item">
    <img src="${product.image}" alt="${product.name}">
    <span class="item_name">${product.name}</span>
    <span class="item_price">$${product.price}</span>
    <button class="snipcart-add-item"
      data-item-id="${product.id}"
      data-item-price="${product.price}"
	  data-item-url="data-item-url="https://waltket.github.io/SrTortillaStore/"
      data-item-description="${product.description}"
      data-item-name="${product.name}">
      Add to Cart
    </button>
  </div>
`;
  });

  const blob = new Blob([html], { type: 'text/html' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'HTMLproducts.txt';
  link.click();
}

// Call the function to generate and download the file
generateStaticHTML();
</script>
</body>
</html>
