<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SrTortilla - Urban Art Gallery</title>
  <link rel="stylesheet" href="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.css" />
  <script async src="https://cdn.snipcart.com/themes/v3.3.0/default/snipcart.js"></script>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #111;
      color: #fff;
    }

    body.modal-open {
      overflow: hidden;
    }

    button {
      font: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid #ff3c38;
      outline-offset: 2px;
    }

    header {
      background-color: #1a1a1a;
      padding: 20px;
      text-align: center;
      border-bottom: 2px solid #444;
      position: relative;
    }

    .logo {
      display: block;
      margin: 0 auto;
      height: 160px;
      width: auto;
    }

    .cart-button {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #ff3c38;
      color: white;
      padding: 8px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .cart-button:hover {
      background: #e52b27;
    }

    #categories-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      padding: 16px 16px 0;
    }

    .category-button {
      padding: 8px 14px;
      border-radius: 999px;
      border: none;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    .category-button:hover {
      background-color: #444;
    }

    .category-button.active-category {
      background-color: #ff3c38;
    }

    #search-bar {
      padding: 16px;
    }

    #search-input {
      display: block;
      margin: 0 auto;
      padding: 10px 14px;
      width: 100%;
      max-width: 500px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      padding: 0 16px 16px;
      max-width: 1200px;
      margin: 0 auto;
      scroll-margin-top: 16px;
    }

    .item {
      display: flex;
      flex-direction: column;
      background: #222;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 0 10px #333;
    }

    .item-image {
      display: block;
      width: 100%;
      padding: 0;
      border: none;
      background: #1a1a1a;
      border-radius: 8px;
      overflow: hidden;
      cursor: zoom-in;
    }

    .item-image img {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 4;
      object-fit: cover;
      transition: transform 0.2s;
    }

    .item-image:hover img {
      transform: scale(1.03);
    }

    .item_name {
      margin-top: 10px;
      font-weight: bold;
      text-align: center;
    }

    .item_price {
      color: #bbb;
      text-align: center;
    }

    .item .snipcart-add-item {
      margin-top: 10px;
      width: 100%;
      padding: 12px;
      background-color: #ff3c38;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .item .snipcart-add-item:hover {
      background-color: #e52b27;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      color: #bbb;
      padding: 40px 0;
    }

    .pagination {
      text-align: center;
      padding-bottom: 30px;
    }

    .pagination button {
      background-color: #333;
      color: white;
      border: none;
      padding: 10px 15px;
      margin: 5px;
      border-radius: 5px;
      cursor: pointer;
    }

    .pagination button.active {
      background-color: #ff3c38;
    }

    /* Product viewer: everything fits in one screen, nothing scrolls */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      flex-direction: column;
      gap: 12px;
      height: 100vh;
      height: 100dvh;
      padding: 64px 16px 16px;
      background-color: rgba(0, 0, 0, 0.92);
    }

    #modal.open {
      display: flex;
    }

    .modal-stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #modal-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      user-select: none;
      transition: opacity 0.2s;
    }

    #modal-img.loading {
      opacity: 0;
    }

    .icon-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background-color: rgba(40, 40, 40, 0.85);
      color: white;
      cursor: pointer;
    }

    .icon-button:hover {
      background-color: #ff3c38;
    }

    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    #modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
    }

    .modal-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
    }

    .modal-arrow.prev {
      left: 0;
    }

    .modal-arrow.next {
      right: 0;
    }

    .modal-info {
      flex: none;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 4px 16px;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
    }

    #modal-name {
      margin: 0;
      font-size: 1.3rem;
    }

    #modal-description {
      margin: 0;
      color: #bbb;
    }

    .modal-meta {
      grid-column: 2;
      grid-row: 1 / span 2;
      text-align: right;
    }

    #modal-price {
      display: block;
      font-size: 1.3rem;
      font-weight: bold;
    }

    #modal-index {
      color: #888;
      font-size: 0.85rem;
    }

    #modal-buy {
      grid-column: 1 / -1;
      margin-top: 8px;
      padding: 12px;
      background-color: #ff3c38;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    #modal-buy:hover {
      background-color: #e52b27;
    }

    @media (max-width: 600px) {
      header {
        padding: 12px;
      }

      .logo {
        height: 110px;
      }

      .cart-button {
        top: 12px;
        right: 12px;
        padding: 6px 10px;
        font-size: 0.85rem;
      }

      .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        padding: 0 12px 12px;
      }

      .item {
        padding: 8px;
      }

      #modal {
        padding: 64px 12px 12px;
      }

      #modal-name,
      #modal-price {
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

<header>
  <img src="srTortillaLogo.jpg" alt="SrTortilla" class="logo">
  <button class="snipcart-checkout cart-button">
    View Cart <span class="snipcart-items-count"></span>
  </button>
</header>

<!-- Category Filter -->
<nav id="categories-bar" aria-label="Categories">
  <button class="category-button active-category" onclick="handleCategoryClick('', this)">All</button>
  <button class="category-button" onclick="handleCategoryClick('Sports', this)">Sports</button>
  <button class="category-button" onclick="handleCategoryClick('Movies', this)">Movies</button>
  <button class="category-button" onclick="handleCategoryClick('Comics', this)">Comics</button>
  <button class="category-button" onclick="handleCategoryClick('Anime', this)">Anime</button>
  <button class="category-button" onclick="handleCategoryClick('Cartoons', this)">Cartoons</button>
  <button class="category-button" onclick="handleCategoryClick('Videogames', this)">Videogames</button>
</nav>

<!-- Search Bar -->
<div id="search-bar">
  <input type="search" id="search-input" placeholder="Search for artwork by name..." aria-label="Search artwork" oninput="filterProducts(activeCategory)">
</div>

<!-- Gallery -->
<section class="gallery" id="gallery"></section>

<!-- Product viewer -->
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-name" onclick="if (event.target === this || event.target.classList.contains('modal-stage')) closeModal()">
  <button id="modal-close" class="icon-button" onclick="closeModal()" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="modal-stage">
    <img id="modal-img" src="" alt="" onload="this.classList.remove('loading')">
    <button class="icon-button modal-arrow prev" onclick="prevSlide()" aria-label="Previous artwork">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="icon-button modal-arrow next" onclick="nextSlide()" aria-label="Next artwork">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>
  <div class="modal-info">
    <h2 id="modal-name"></h2>
    <p id="modal-description"></p>
    <div class="modal-meta">
      <span id="modal-price"></span>
      <span id="modal-index"></span>
    </div>
    <button id="modal-buy" class="snipcart-add-item">Add to Cart</button>
  </div>
</div>

<!-- Pagination -->
<div class="pagination" id="pagination"></div>

<div hidden id="snipcart"
  data-api-key="ZDYxODU0NjUtOGY1Yi00Yzg2LWFjODQtNjE4ZTJjNWM3ZWUxNjM4ODcxOTk1NzUwMTA5NDkw">
</div>

<script>
document.addEventListener('snipcart.ready', () => {
  Snipcart.events.on('shipping.selected', s => console.log('Shipping selected:', s));
  Snipcart.events.on('payment.failed', e => console.error('Payment failed:', e));
  Snipcart.events.on('cart.confirm.error', e => console.error('Confirm error:', e));
});
</script>

<script>
const SITE_URL = 'https://srtortilla.art/';
// Snipcart validates prices against this file at checkout.
// When you add a product or change a price here, update products.json too.
const PRODUCTS_URL = SITE_URL + 'products.json';

let allProducts = [
  { id: 1,  category: 'Sports',     name: 'Kobe',                    price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0050.jpg', description: 'Mamba mentality' },
  { id: 2,  category: 'Sports',     name: 'CR7',                     price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0051.jpg', description: 'Siuuu' },
  { id: 3,  category: 'Comics',     name: 'Iron Man',                price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0054.jpg', description: 'Repulsor ready' },
  { id: 4,  category: 'Sports',     name: 'Messi',                   price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0055.jpg', description: 'Albiceleste #10' },
  { id: 5,  category: 'Movies',     name: 'R2-D2',                   price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0057.jpg', description: 'Dripping droid' },
  { id: 6,  category: 'Anime',      name: 'Goku',                    price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0058.jpg', description: 'Super Saiyan' },
  { id: 7,  category: 'Comics',     name: 'Joker',                   price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0059.jpg', description: 'Put on a happy face' },
  { id: 8,  category: 'Comics',     name: 'Harley Quinn',            price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0061.jpg', description: 'Queen of hearts' },
  { id: 9,  category: 'Movies',     name: 'Stitch',                  price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0062.jpg', description: 'Experiment 626' },
  { id: 10, category: 'Anime',      name: 'Naruto',                  price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0063.jpg', description: 'Believe it' },
  { id: 11, category: ['Cartoons', 'Anime'], name: 'Hello Kitty',             price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0064.jpg', description: 'Flower power' },
  { id: 12, category: 'Anime',      name: 'Luffy',                   price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0065.jpg', description: 'Straw hat captain' },
  { id: 13, category: 'Comics',     name: 'Venom',                   price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0067.jpg', description: 'We are Venom' },
  { id: 14, category: 'Comics',     name: 'Spider-Man vs Symbiotes', price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0068.jpg', description: 'Carnage and Venom' },
  { id: 15, category: 'Movies',     name: 'Darth Vader',             price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0069.jpg', description: 'The dark side' },
  { id: 16, category: 'Movies',     name: 'Jack Skellington',        price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0071.jpg', description: 'Pumpkin King' },
  { id: 17, category: ['Videogames', 'Anime'], name: 'Pikachu',                 price: 29.99, image: 'dlosimages10072026/IMG-20261007-WA0072.jpg', description: 'Pika pika' },
];

let currentPage = 1;
const itemsPerPage = 12;
let activeCategory = '';
let filteredProducts = [...allProducts];
let currentIndex = 0;

function renderPage() {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';

  if (filteredProducts.length === 0) {
    gallery.innerHTML = '<p class="empty-state">No artwork matches your search.</p>';
  }

  const start = (currentPage - 1) * itemsPerPage;
  const paginatedProducts = filteredProducts.slice(start, start + itemsPerPage);

  paginatedProducts.forEach((product, index) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `
      <button class="item-image" onclick="openModal(${start + index})" aria-label="View ${product.name}">
        <img src="${product.image}" alt="${product.name}" loading="lazy">
      </button>
      <span class="item_name">${product.name}</span>
      <span class="item_price">$${product.price}</span>
      <button class="snipcart-add-item"
        data-item-id="${product.id}"
        data-item-price="${product.price}"
        data-item-url="${PRODUCTS_URL}"
        data-item-description="${product.description}"
        data-item-image="${SITE_URL}${product.image}"
        data-item-name="${product.name}">
        Add to Cart
      </button>
    `;
    gallery.appendChild(div);
  });

  renderPagination();
}

function renderPagination() {
  const pagination = document.getElementById('pagination');
  pagination.innerHTML = '';

  const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);
  if (totalPages <= 1) return;

  for (let i = 1; i <= totalPages; i++) {
    const button = document.createElement('button');
    button.textContent = i;
    button.onclick = () => goToPage(i);
    if (i === currentPage) button.classList.add('active');
    pagination.appendChild(button);
  }
}

function goToPage(page) {
  if (page < 1 || page > Math.ceil(filteredProducts.length / itemsPerPage)) return;
  currentPage = page;
  renderPage();
  document.getElementById('gallery').scrollIntoView({ behavior: 'smooth' });
}

function openModal(index) {
  currentIndex = index;
  updateModalContent();
  document.getElementById('modal').classList.add('open');
  document.body.classList.add('modal-open');
  document.getElementById('modal-close').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.body.classList.remove('modal-open');
}

function updateModalContent() {
  const product = filteredProducts[currentIndex];

  const img = document.getElementById('modal-img');
  if (!img.src.endsWith(product.image)) {
    img.classList.add('loading');
    img.src = product.image;
  }
  img.alt = product.name;

  // Preload neighbours so Previous/Next feel instant
  [currentIndex - 1, currentIndex + 1].forEach(i => {
    const p = filteredProducts[(i + filteredProducts.length) % filteredProducts.length];
    if (p) new Image().src = p.image;
  });
  document.getElementById('modal-name').textContent = product.name;
  document.getElementById('modal-description').textContent = product.description || '';
  document.getElementById('modal-price').textContent = `$${product.price}`;
  document.getElementById('modal-index').textContent = `${currentIndex + 1} of ${filteredProducts.length}`;

  const single = filteredProducts.length < 2;
  document.querySelectorAll('.modal-arrow').forEach(btn => btn.hidden = single);

  const buyBtn = document.getElementById('modal-buy');
  buyBtn.setAttribute('data-item-id', product.id);
  buyBtn.setAttribute('data-item-name', product.name);
  buyBtn.setAttribute('data-item-price', product.price);
  buyBtn.setAttribute('data-item-url', PRODUCTS_URL);
  buyBtn.setAttribute('data-item-description', product.description);
  buyBtn.setAttribute('data-item-image', SITE_URL + product.image);
}

function prevSlide() {
  if (filteredProducts.length === 0) return;
  currentIndex = (currentIndex - 1 + filteredProducts.length) % filteredProducts.length;
  updateModalContent();
}

function nextSlide() {
  if (filteredProducts.length === 0) return;
  currentIndex = (currentIndex + 1) % filteredProducts.length;
  updateModalContent();
}

// Snipcart adds the item itself because the button has the snipcart-add-item class,
// so here we only close the viewer to reveal the cart.
document.getElementById('modal-buy').addEventListener('click', closeModal);

document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  else if (e.key === 'ArrowLeft') prevSlide();
  else if (e.key === 'ArrowRight') nextSlide();
});

let touchStartX = null;
const modalStage = document.querySelector('.modal-stage');
modalStage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
modalStage.addEventListener('touchend', e => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 50) dx > 0 ? prevSlide() : nextSlide();
  touchStartX = null;
});

function filterProducts(category = '') {
  const searchTerm = document.getElementById('search-input').value.toLowerCase();
  activeCategory = category;

  filteredProducts = allProducts.filter(product =>
    product.name.toLowerCase().includes(searchTerm) &&
    (activeCategory === '' || [].concat(product.category).includes(activeCategory))
  );

  currentPage = 1;
  renderPage();
}

function handleCategoryClick(category, button) {
  // Clicking the active category again goes back to All
  if (category !== '' && activeCategory === category) {
    category = '';
    button = document.querySelector('.category-button');
  }
  document.querySelectorAll('.category-button').forEach(btn => btn.classList.remove('active-category'));
  button.classList.add('active-category');
  filterProducts(category);
}

renderPage();
</script>

</body>
</html>
